<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href placeholder is replaced by `flutter build web --base-href`.
    Escriba is served from the root of its Worker, so the default "/" applies.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Learn to write foreign alphabets by hand, with a stylus on a 2-in-1 tablet.">

  <!--
    Stylus / touch: disable browser pinch-zoom and double-tap zoom so pen and
    finger gestures reach the Flutter canvas instead of scrolling or zooming
    the page. Flutter handles its own gestures.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3E6FB0">

  <!-- iOS / installable web app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Escriba">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Escriba</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      A stylus app must own every pointer event: `touch-action: none` stops the
      browser from turning pen/finger drags into scroll, pan or zoom, and
      `overscroll-behavior: none` stops pull-to-refresh / bounce. This applies
      to the page, Flutter's host view and every canvas it creates.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background: #6B4423;
    }
    flutter-view, flt-glass-pane, canvas {
      touch-action: none;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
